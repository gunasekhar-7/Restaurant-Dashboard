<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <meta name="description" content="TastyKart Partner Hub - High-performance B2B merchant portal for real-time kitchen dispatch, menu management, and revenue analytics."/>
  <title>TastyKart Partner Hub - Culinary Operations & Kitchen Display System</title>
  
  <!-- Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface": "#f3fbf6",
            "surface-bright": "#f3fbf6",
            "surface-dim": "#d3dcd7",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#edf6f0",
            "surface-container": "#e7f0eb",
            "surface-container-high": "#e2eae5",
            "surface-container-highest": "#dce5df",
            "on-surface": "#151d1a",
            "on-surface-variant": "#414845",
            "inverse-surface": "#2a322f",
            "inverse-on-surface": "#eaf3ee",
            "outline": "#717974",
            "outline-variant": "#c1c8c3",
            "surface-tint": "#416658",
            "primary": "#002218",
            "primary-container": "#12382c",
            "on-primary": "#ffffff",
            "on-primary-container": "#7ba292",
            "primary-fixed": "#c3ebda",
            "primary-fixed-dim": "#a7cfbe",
            "on-primary-fixed": "#002117",
            "on-primary-fixed-variant": "#294e41",
            "secondary": "#895100",
            "secondary-container": "#fd9d1a",
            "on-secondary": "#ffffff",
            "on-secondary-container": "#663b00",
            "secondary-fixed": "#ffdcbc",
            "secondary-fixed-dim": "#ffb86b",
            "on-secondary-fixed": "#2c1700",
            "tertiary": "#00221b",
            "tertiary-container": "#0f3830",
            "on-tertiary": "#ffffff",
            "error": "#ba1a1a",
            "error-container": "#ffdad6",
            "on-error-container": "#93000a"
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace']
          }
        }
      }
    };
  </script>

  <!-- Tokens & Floor Rules -->
  <link rel="stylesheet" href="./src/styles/tokens.css"/>
</head>
<body class="bg-surface font-sans text-on-surface antialiased min-h-screen">
  <div id="app"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
